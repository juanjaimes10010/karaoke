<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>YouTube Player</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
      }

      #player {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="player"></div>

    <script>
      let player = null;
      let playerReady = false;
      let pendingVideoId = null;

      console.log("youtube.html loaded");

      // Load YouTube IFrame API
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);

      // Receive commands from controller
      if (window.electronAPI) {
        window.electronAPI.onPlayerCommand((data) => {
          console.log("Received command:", data);

          if (data.type === "load") {
            if (!playerReady || !player) {
              pendingVideoId = data.videoId;
              return;
            }

            player.loadVideoById(data.videoId);
          }

          if (data.type === "play") {
            if (playerReady && player) {
              player.playVideo();
            }
          }

          if (data.type === "pause") {
            if (playerReady && player) {
              player.pauseVideo();
            }
          }

          if (data.type === "clear") {
            if (playerReady && player) {
              player.stopVideo();
            }
          }
        });
      }
      // YouTube API callback
      onYouTubeIframeAPIReady = function () {
        console.log("YouTube API ready");

        player = new YT.Player("player", {
          width: "100%",
          height: "100%",

          playerVars: {
            autoplay: 1,
            controls: 1,
            rel: 0,
            modestbranding: 1,
            enablejsapi: 1,
            origin: window.location.origin,
            playsinline: 1,
          },

          events: {
            onReady: function () {
              console.log("Player ready");
              playerReady = true;
              window.electronAPI?.sendPlayerEvent({ type: "ready" });

              if (pendingVideoId) {
                player.loadVideoById(pendingVideoId);
                pendingVideoId = null;
              }
            },

            onError: function (event) {
              console.error("YouTube error:", event.data);

              window.electronAPI?.sendPlayerEvent({
                type: "error",
                errorCode: event.data,
              });
            },

            onStateChange: function (event) {
              const states = {
                [YT.PlayerState.PLAYING]: "playing",
                [YT.PlayerState.PAUSED]: "paused",
                [YT.PlayerState.ENDED]: "ended",
              };
              const type = states[event.data];

              if (type) {
                window.electronAPI?.sendPlayerEvent({ type });
              }
            },
          },
        });
      };
    </script>
  </body>
</html>

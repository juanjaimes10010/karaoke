<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>YouTube Controller</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        height: 100%;
        max-height: 100%;
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        max-height: 100%;
        max-width: 750px;
        margin: auto;
        padding: 10px;
        background: #111;
        color: white;
      }

      h1 {
        padding-bottom: 10px;
      }

      button {
        padding: 10px 14px;
        margin: 4px;
        cursor: pointer;
        border: 0;
        border-radius: 6px;
        background: #333;
        color: white;
        font-size: 16px;
      }

      button:hover {
        background: #555;
      }

      .controls {
        margin: 15px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      #clearButton {
        background: #600;
      }

      #clearButton:hover {
        background: #900;
      }

      #nowPlaying {
        padding: 14px;
        background: #1c1c1c;
        border-radius: 6px;
        font-weight: bold;
      }

      #status {
        margin: 10px 0;
        color: #aaa;
        font-size: 14px;
      }

      .playlist-controls, .volume-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0 10px;
      }

      .playlist-controls input, .playlist-controls select {
        min-width: 0;
        flex: 1;
        padding: 9px;
        border: 1px solid #444;
        border-radius: 5px;
        background: #222;
        color: white;
      }

      .volume-controls input { flex: 1; }

      #notification {
        position: fixed;
        right: 14px;
        bottom: 14px;
        left: 14px;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-left: 4px solid #888;
        border-radius: 6px;
        background: #292929;
        box-shadow: 0 4px 18px #000a;
        color: white;
        line-height: 1.4;
      }

      #notification.visible {
        display: flex;
      }

      #notificationMessage {
        flex: 1;
      }

      #notificationClose {
        flex: none;
        margin: 0;
        padding: 0 4px;
        background: transparent;
        color: inherit;
        font-size: 22px;
        line-height: 1;
      }

      #notificationClose:hover {
        background: #ffffff22;
      }

      #notification.error {
        border-color: #ff7777;
        background: #481818;
      }

      #notification.success {
        border-color: #75d98b;
        background: #173b20;
      }

      h2 {
        margin-bottom: 5px;
      }

      #queue {
        list-style: none;
        padding: 10px 20px;
        flex: 1;
        overflow-y: scroll;
      }

      #queue li {
        padding: 14px;
        margin: 6px 0;
        background: #222;
        border: 1px solid #333;
        border-radius: 6px;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s;
      }

      #queue li:hover {
        background: #333;
      }

      #queue li.active {
        background: #444;
        border-color: #777;
        font-weight: bold;
      }

      .video-title {
        padding-right: 45px;
        line-height: 1.4;
        max-width: 40ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .remove {
        float: right;
        background: #600;
        padding: 5px 9px;
        margin: -3px 0 0 10px;
      }

      .remove:hover {
        background: #900;
      }

      .error {
        color: #ff7777;
      }
    </style>
  </head>

  <body>
    <h1>YouTube Controller</h1>

    <div class="controls">
      <button id="previousButton">⏮ Previous</button>

      <button id="playButton">▶ Play</button>

      <button id="pauseButton">⏸ Pause</button>

      <button id="nextButton">Next ⏭</button>

      <button id="clearButton">🗑 Clear Queue</button>
    </div>

    <div id="nowPlaying">Nothing playing</div>

    <div id="status">Player connecting...</div>

    <div id="notification" role="status" aria-live="polite">
      <span id="notificationMessage"></span>
      <button id="notificationClose" type="button" aria-label="Close notification">×</button>
    </div>

    <div class="volume-controls">
      <label for="volumeSlider">Volume</label>
      <input id="volumeSlider" type="range" min="0" max="100" value="100" />
      <span id="volumeValue">100%</span>
    </div>

    <div class="playlist-controls">
      <select id="playlistSelect" aria-label="Choose playlist"></select>
      <input id="playlistName" type="text" maxlength="60" placeholder="New playlist name" />
      <button id="createPlaylistButton" type="button">Create</button>
    </div>

    <h2>Queue</h2>

    <ul id="queue"></ul>

    <script>
      const playButton = document.getElementById("playButton");

      const pauseButton = document.getElementById("pauseButton");

      const nextButton = document.getElementById("nextButton");

      const previousButton = document.getElementById("previousButton");

      const clearButton = document.getElementById("clearButton");
      const volumeSlider = document.getElementById("volumeSlider");
      const volumeValue = document.getElementById("volumeValue");
      const playlistSelect = document.getElementById("playlistSelect");
      const playlistName = document.getElementById("playlistName");
      const createPlaylistButton = document.getElementById("createPlaylistButton");

      const queueElement = document.getElementById("queue");

      const nowPlaying = document.getElementById("nowPlaying");

      const status = document.getElementById("status");
      const notification = document.getElementById("notification");
      const notificationMessage = document.getElementById("notificationMessage");
      const notificationClose = document.getElementById("notificationClose");

      const playlistStorageKey = "youtube-karaoke-playlists";
      let playlistData;
      try {
        playlistData = JSON.parse(localStorage.getItem(playlistStorageKey)) || {};
      } catch {
        playlistData = {};
      }
      if (!playlistData.playlists || typeof playlistData.playlists !== "object") {
        playlistData = { activePlaylist: "My Playlist", playlists: { "My Playlist": [] } };
      }
      if (!Object.keys(playlistData.playlists).length) {
        playlistData.playlists["My Playlist"] = [];
      }
      let activePlaylist = playlistData.activePlaylist in playlistData.playlists
        ? playlistData.activePlaylist
        : Object.keys(playlistData.playlists)[0];
      let queue = [...(playlistData.playlists[activePlaylist] || [])];
      let currentIndex = -1;
      let addVideoTasks = Promise.resolve();
      let notificationTimeout = null;

      function savePlaylists() {
        playlistData.activePlaylist = activePlaylist;
        playlistData.playlists[activePlaylist] = queue;
        localStorage.setItem(playlistStorageKey, JSON.stringify(playlistData));
      }

      function renderPlaylists() {
        playlistSelect.replaceChildren();
        Object.keys(playlistData.playlists).forEach((name) => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          option.selected = name === activePlaylist;
          playlistSelect.appendChild(option);
        });
      }

      createPlaylistButton.addEventListener("click", () => {
        const name = playlistName.value.trim();
        if (!name) {
          status.textContent = "Enter a playlist name.";
          playlistName.focus();
          return;
        }
        if (playlistData.playlists[name]) {
          status.textContent = "That playlist already exists.";
          return;
        }
        savePlaylists();
        playlistData.playlists[name] = [];
        activePlaylist = name;
        queue = [];
        currentIndex = -1;
        playlistName.value = "";
        renderPlaylists();
        renderQueue();
        window.parent.electronAPI.sendPlayerCommand({ type: "clear" });
        nowPlaying.textContent = "Nothing playing";
        status.textContent = `Created playlist: ${name}`;
        savePlaylists();
      });

      playlistSelect.addEventListener("change", () => {
        savePlaylists();
        activePlaylist = playlistSelect.value;
        queue = [...(playlistData.playlists[activePlaylist] || [])];
        currentIndex = queue.length ? 0 : -1;
        renderQueue();
        if (currentIndex >= 0) loadCurrentVideo();
        else {
          window.parent.electronAPI.sendPlayerCommand({ type: "clear" });
          nowPlaying.textContent = "Nothing playing";
        }
        status.textContent = `Loaded playlist: ${activePlaylist}`;
        savePlaylists();
      });

      volumeSlider.addEventListener("input", () => {
        const volume = Number(volumeSlider.value);
        volumeValue.textContent = `${volume}%`;
        window.parent.electronAPI.sendPlayerCommand({ type: "volume", volume: volume / 100 });
      });

      function showNotification(message, type = "info") {
        notificationMessage.textContent = message;
        notification.className = `visible ${type}`;
        clearTimeout(notificationTimeout);
        notificationTimeout = setTimeout(() => {
          hideNotification();
        }, 8000);
      }

      function hideNotification() {
        clearTimeout(notificationTimeout);
        notification.className = "";
        notificationMessage.textContent = "";
      }

      notificationClose.addEventListener("click", hideNotification);

      function queueVideoRequest(url, title = "") {
        addVideoTasks = addVideoTasks
          .then(() => addVideoToQueue(url, title))
          .catch((error) => {
            console.error("Add video error:", error);
            status.textContent = "Failed to add video.";
          });
      }

      async function addVideoToQueue(url, title) {
        const videoId = getYouTubeVideoId(url);

        if (!videoId) {
          status.textContent =
            "Open a YouTube video or click a video link, then add it to the queue.";
          return;
        }

        const video = { videoId, title: title || videoId };
        queue.push(video);
        savePlaylists();
        renderQueue();
        status.textContent = `Added: ${video.title}`;
        showNotification(`Added to queue: ${video.title}`, "success");

        if (currentIndex === -1) {
          currentIndex = 0;
          loadCurrentVideo();
        }
      }

      // ----------------------------------------------------------
      // EXTRACT YOUTUBE VIDEO ID
      // ----------------------------------------------------------

      function getYouTubeVideoId(url) {
        if (!url) {
          return null;
        }

        try {
          const parsed = new URL(url);

          const host = parsed.hostname.toLowerCase().replace(/^www\./, "");

          // youtube.com/watch?v=VIDEO_ID

          if (host === "youtube.com" || host.endsWith(".youtube.com")) {
            const watchId = parsed.searchParams.get("v");

            if (watchId) {
              return cleanVideoId(watchId);
            }

            // youtube.com/shorts/VIDEO_ID

            const shortsMatch = parsed.pathname.match(/^\/shorts\/([^/?#]+)/);

            if (shortsMatch) {
              return cleanVideoId(shortsMatch[1]);
            }

            // youtube.com/live/VIDEO_ID

            const liveMatch = parsed.pathname.match(/^\/live\/([^/?#]+)/);

            if (liveMatch) {
              return cleanVideoId(liveMatch[1]);
            }

            // youtube.com/embed/VIDEO_ID

            const embedMatch = parsed.pathname.match(/^\/embed\/([^/?#]+)/);

            if (embedMatch) {
              return cleanVideoId(embedMatch[1]);
            }
          }

          // youtu.be/VIDEO_ID

          if (host === "youtu.be") {
            const id = parsed.pathname.split("/").filter(Boolean)[0];

            return cleanVideoId(id);
          }
        } catch (error) {
          console.error("Invalid YouTube URL:", error);
        }

        return null;
      }

      function cleanVideoId(value) {
        if (!value) {
          return null;
        }

        const id = String(value)
          .split(/[?&#/]/)[0]
          .trim();

        return id || null;
      }

      // ----------------------------------------------------------
      // LOAD CURRENT VIDEO
      // ----------------------------------------------------------

      function loadCurrentVideo() {
        if (currentIndex < 0 || currentIndex >= queue.length) {
          nowPlaying.textContent = "Nothing playing";

          renderQueue();

          return;
        }

        const video = queue[currentIndex];

        window.parent.electronAPI.sendPlayerCommand({
          type: "load",
          videoId: video.videoId,
        });

        nowPlaying.textContent = `Playing ${currentIndex + 1}/${
          queue.length
        }: ${video.title}`;

        status.textContent = "Loading video...";

        renderQueue();
      }

      playButton.addEventListener("click", () => {
        window.parent.electronAPI.sendPlayerCommand({ type: "play" });
      });

      pauseButton.addEventListener("click", () => {
        window.parent.electronAPI.sendPlayerCommand({ type: "pause" });
      });

      // ----------------------------------------------------------
      // NEXT
      // ----------------------------------------------------------

      nextButton.addEventListener("click", () => {
        if (queue.length === 0) {
          return;
        }

        if (currentIndex < queue.length - 1) {
          currentIndex++;

          loadCurrentVideo();
        } else {
          status.textContent = "End of queue.";
        }
      });

      // ----------------------------------------------------------
      // PREVIOUS
      // ----------------------------------------------------------

      previousButton.addEventListener("click", () => {
        if (queue.length === 0) {
          return;
        }

        if (currentIndex > 0) {
          currentIndex--;

          loadCurrentVideo();
        }
      });

      // ----------------------------------------------------------
      // CLEAR QUEUE
      // ----------------------------------------------------------

      clearButton.addEventListener("click", () => {
        queue = [];
        savePlaylists();

        currentIndex = -1;

        window.parent.electronAPI.sendPlayerCommand({
          type: "clear",
        });

        nowPlaying.textContent = "Nothing playing";

        status.textContent = "Queue cleared.";

        renderQueue();
      });

      // ----------------------------------------------------------
      // REMOVE ITEM / RENDER QUEUE
      // ----------------------------------------------------------

      function removeQueueItem(index) {
        if (index < 0 || index >= queue.length) {
          return;
        }

        const wasCurrent = index === currentIndex;

        queue.splice(index, 1);
        savePlaylists();

        if (queue.length === 0) {
          currentIndex = -1;

          window.parent.electronAPI.sendPlayerCommand({
            type: "clear",
          });

          nowPlaying.textContent = "Nothing playing";

          status.textContent = "Queue is empty.";
        } else if (index < currentIndex) {
          currentIndex--;
        } else if (index === currentIndex) {
          currentIndex = Math.min(currentIndex, queue.length - 1);

          if (wasCurrent) {
            loadCurrentVideo();
          }
        }

        renderQueue();
      }

      function renderQueue() {
        queueElement.innerHTML = "";

        queue.forEach((video, index) => {
          const li = document.createElement("li");

          if (index === currentIndex) {
            li.classList.add("active");
          }

          const removeButton = document.createElement("button");

          removeButton.className = "remove";

          removeButton.textContent = "✕";

          const videoTitle = document.createElement("div");

          videoTitle.className = "video-title";

          videoTitle.textContent = `${index + 1}. ${video.title}`;

          videoTitle.addEventListener("click", () => {
            currentIndex = index;

            loadCurrentVideo();
          });

          removeButton.addEventListener("click", (event) => {
            event.stopPropagation();

            removeQueueItem(index);
          });

          li.appendChild(removeButton);

          li.appendChild(videoTitle);

          queueElement.appendChild(li);
        });
      }

      // ----------------------------------------------------------
      // PLAYER STATUS / AUTO NEXT
      // ----------------------------------------------------------

      if (window.parent.electronAPI) {
        window.parent.electronAPI.onYouTubeVideoAddRequest((video) => {
          queueVideoRequest(video?.url, video?.title);
        });

        status.textContent = "Controller ready.";
      } else {
        status.textContent = "Electron API is not available.";
      }

      renderPlaylists();
      renderQueue();
    </script>
  </body>
</html>

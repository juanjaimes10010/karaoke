```html
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>YouTube Controller</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #controller {
        position: absolute;
        top: 0;
        left: 0;

        width: 40%;
        height: 100%;

        overflow: hidden;
      }

      #controller iframe {
        width: 100%;
        height: 100%;

        border: 0;
        display: block;
      }

      #divider {
        position: absolute;
        top: 0;

        left: 40%;

        width: 8px;
        height: 100%;

        background: #1a1a1a;

        cursor: col-resize;

        z-index: 9999;

        user-select: none;
        touch-action: none;
      }

      #divider:hover,
      #divider.dragging {
        background: #444;
      }

      #divider::after {
        content: "";

        position: absolute;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        width: 2px;
        height: 60px;

        background: #777;

        border-radius: 2px;
      }
    </style>
  </head>

  <body>
    <div id="controller">
      <iframe src="controller.html" title="Controller"></iframe>
    </div>

    <div id="divider"></div>

    <script>
      const controller = document.getElementById("controller");
      const divider = document.getElementById("divider");

      let dragging = false;

      divider.addEventListener("pointerdown", (event) => {
        dragging = true;

        divider.classList.add("dragging");

        divider.setPointerCapture(event.pointerId);

        event.preventDefault();
      });

      divider.addEventListener("pointermove", (event) => {
        if (!dragging) return;

        const width = window.innerWidth;

        let x = event.clientX;

        const min = 250;
        const max = width - 250;

        x = Math.max(min, Math.min(x, max));

        const percentage = (x / width) * 100;

        controller.style.width = `${percentage}%`;
        divider.style.left = `${percentage}%`;

        // Tell main Electron process where the divider is.
        if (window.electronAPI) {
          window.electronAPI.setDividerPosition(x);
        }
      });

      divider.addEventListener("pointerup", (event) => {
        dragging = false;

        divider.classList.remove("dragging");

        try {
          divider.releasePointerCapture(event.pointerId);
        } catch {}
      });

      divider.addEventListener("pointercancel", () => {
        dragging = false;
        divider.classList.remove("dragging");
      });
    </script>
  </body>
</html>
